<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - noCauTe</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h2>nocaute</h2>
            <p>CENTRO DE TREINAMENTO</p>
        </div>
        
        <div class="login-tabs">
            <button class="tab-btn active" onclick="switchTab('aluno')">Aluno</button>
            <button class="tab-btn" onclick="switchTab('instrutor')">Instrutor</button>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="aluno@nocaute.com" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="123456" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Entrar como aluno</button>
            <p class="help-text">Protótipo: qualquer e-mail e senha funcionam.</p>
        </form>

        <a href="index.html" class="back-link">&larr; Voltar ao site</a>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
